<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="url(#bg)" rx="16"/>

  <!-- Grid dots -->
  <g fill="#ffffff" opacity="0.08">
    <circle cx="50" cy="30" r="2"><animate attributeName="opacity" values="0.08;0.3;0.08" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="50" r="2"><animate attributeName="opacity" values="0.08;0.3;0.08" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="20" r="2"><animate attributeName="opacity" values="0.08;0.3;0.08" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="40" r="2"><animate attributeName="opacity" values="0.08;0.3;0.08" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="25" r="2"><animate attributeName="opacity" values="0.08;0.3;0.08" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="750" cy="55" r="2"><animate attributeName="opacity" values="0.08;0.3;0.08" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="100" cy="160" r="2"><animate attributeName="opacity" values="0.08;0.3;0.08" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="180" r="2"><animate attributeName="opacity" values="0.08;0.3;0.08" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="170" r="2"><animate attributeName="opacity" values="0.08;0.3;0.08" dur="3.9s" repeatCount="indefinite"/></circle>
    <circle cx="550" cy="185" r="2"><animate attributeName="opacity" values="0.08;0.3;0.08" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="165" r="2"><animate attributeName="opacity" values="0.08;0.3;0.08" dur="3.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Circuit lines -->
  <g stroke="#3b82f6" stroke-width="0.5" opacity="0.15" fill="none">
    <path d="M0,100 Q200,50 400,100 T800,100"><animate attributeName="d" values="M0,100 Q200,50 400,100 T800,100;M0,100 Q200,150 400,100 T800,100;M0,100 Q200,50 400,100 T800,100" dur="8s" repeatCount="indefinite"/></path>
    <path d="M0,140 Q200,170 400,140 T800,140" opacity="0.1"/>
  </g>

  <!-- Floating particles -->
  <g fill="#8b5cf6">
    <circle cx="100" cy="100" r="3"><animate attributeName="cy" values="100;80;100" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;0.6;0.2" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="350" cy="80" r="2.5"><animate attributeName="cy" values="80;60;80" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;0.5;0.2" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="120" r="2"><animate attributeName="cy" values="120;95;120" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.15;0.4;0.15" dur="4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Title: Ever Ferreira -->
  <text x="400" y="95" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800"
        fill="url(#glow)" filter="url(#neon)">
    ✨ Ever Ferreira
    <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- Subtitle -->
  <text x="400" y="130" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
    IA Developer · Tech Educator · Instrutora Sênior
  </text>

  <!-- Decorative line -->
  <line x1="250" y1="150" x2="550" y2="150" stroke="url(#glow)" stroke-width="1.5" opacity="0.5"
        stroke-linecap="round">
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="4s" repeatCount="indefinite"/>
  </line>

  <!-- Small tech icons -->
  <g fill="#3b82f6" opacity="0.3">
    <text x="100" y="60" font-size="20">&lt;/&gt;</text>
    <text x="680" y="170" font-size="18">λ</text>
    <text x="650" y="45" font-size="16">{ }</text>
  </g>
</svg>